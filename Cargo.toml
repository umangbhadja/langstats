[package]
name = "langstats"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, offline language statistics for local directories"
license = "MIT"
repository = "https://github.com/umangbhadja/langstats"
readme = "README.md"
keywords = ["linguist", "language", "statistics", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
