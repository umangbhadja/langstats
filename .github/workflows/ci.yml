name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Cache Rust dependencies on macOS Intel
        if: matrix.os == 'macos-15-intel'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Release build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Unix installer smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/langstats-installer-home"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexit 42\n' > "$HOME/.local/bin/langstats"
          sh scripts/install.sh
          "$HOME/.local/bin/langstats" --version
          test -f "$HOME/.local/share/langstats/NOTICE"
          case "$(sh scripts/install.sh)" in
            *'already up to date'*) ;;
            *) exit 1 ;;
          esac
          sh scripts/uninstall.sh
          test ! -e "$HOME/.local/bin/langstats"
          test ! -e "$HOME/.local/share/langstats/NOTICE"
          sh scripts/uninstall.sh
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'langstats-installer-home'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\langstats'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $installDir 'langstats.exe'), 'old binary')
          .\scripts\install.ps1
          & (Join-Path $env:LOCALAPPDATA 'Programs\langstats\langstats.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\langstats\NOTICE'))) { throw 'NOTICE missing' }
          $upToDate = .\scripts\install.ps1 6>&1 | Out-String
          if ($upToDate -notmatch 'already up to date') { throw 'installer did not skip current version' }
          .\scripts\uninstall.ps1
          if (Test-Path (Join-Path $installDir 'langstats.exe')) { throw 'binary still installed' }
          if (Test-Path (Join-Path $installDir 'NOTICE')) { throw 'NOTICE still installed' }
          if (@([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd([char]'\') -eq $installDir.TrimEnd([char]'\') }).Count -ne 0) { throw 'user PATH still contains langstats' }
          .\scripts\uninstall.ps1
