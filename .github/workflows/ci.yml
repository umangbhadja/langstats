name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: quality (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: langstats }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: langstats }
          - { os: macos-15, target: aarch64-apple-darwin, exe: langstats }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: langstats }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: langstats.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: langstats.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Release tooling regression tests
        run: python scripts/test_release.py
      - name: Release build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Unix installer regression tests
        if: runner.os != 'Windows'
        run: python3 scripts/test_install.py
      - name: Windows installer regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install.ps1
      - name: Windows PowerShell 5.1 installer regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install.ps1
      - name: Unix installer smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/langstats-installer-home"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexit 42\n' > "$HOME/.local/bin/langstats"
          sh scripts/install.sh
          "$HOME/.local/bin/langstats" --version
          test -f "$HOME/.local/share/langstats/NOTICE"
          # Latest can change between calls; fixed-version skip is tested offline.
          case "$(sh scripts/install.sh)" in
            *'already up to date'*|*'Updated langstats '*) ;;
            *) exit 1 ;;
          esac
          sh scripts/uninstall.sh
          test ! -e "$HOME/.local/bin/langstats"
          test ! -e "$HOME/.local/share/langstats/NOTICE"
          sh scripts/uninstall.sh
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'langstats-installer-home'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\langstats'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $installDir 'langstats.exe'), 'old binary')
          .\scripts\install.ps1
          & (Join-Path $env:LOCALAPPDATA 'Programs\langstats\langstats.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\langstats\NOTICE'))) { throw 'NOTICE missing' }
          # Latest can change between calls.
          $recheck = .\scripts\install.ps1 6>&1 | Out-String
          if ($recheck -notmatch 'already up to date|Updated langstats ') { throw 'installer neither skipped nor updated installation' }
          .\scripts\uninstall.ps1
          if (Test-Path (Join-Path $installDir 'langstats.exe')) { throw 'binary still installed' }
          if (Test-Path (Join-Path $installDir 'NOTICE')) { throw 'NOTICE still installed' }
          if (@([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd([char]'\') -eq $installDir.TrimEnd([char]'\') }).Count -ne 0) { throw 'user PATH still contains langstats' }
          .\scripts\uninstall.ps1
      - name: Package candidate release
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python scripts/package_release.py target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.target }} "$version" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  verify-artifacts:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify candidate release archives
        run: |
          python -c 'from pathlib import Path; archives = list(Path("dist").glob("*.tar.gz")) + list(Path("dist").glob("*.zip")); assert len(archives) == 6, f"Expected six platform archives, found {len(archives)}"'
          python scripts/verify_release.py dist
