name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: langstats }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: langstats }
          - { os: macos-15, target: aarch64-apple-darwin, exe: langstats }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: langstats }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: langstats.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: langstats.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check version
        run: python scripts/check_release_version.py ${{ github.ref_name }}
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: python scripts/package_release.py target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.target }} ${{ github.ref_name }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives
        run: python scripts/verify_release.py dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes
