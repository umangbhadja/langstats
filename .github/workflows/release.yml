name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check version before scheduling platform builds
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: langstats }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: langstats }
          - { os: macos-15, target: aarch64-apple-darwin, exe: langstats }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: langstats }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, exe: langstats.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: langstats.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_version.py
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Release tooling regression tests
        run: python scripts/test_release.py
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check native executable version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c 'import os, subprocess, sys;
          actual = subprocess.check_output([sys.argv[1], "--version"], text=True).strip();
          expected = "langstats " + os.environ["RELEASE_TAG"].removeprefix("v");
          sys.exit(0 if actual == expected else f"expected {expected}, got {actual}")'
          target/${{ matrix.target }}/release/${{ matrix.exe }}
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.target }} dist
      - name: Verify native archive
        run: python scripts/verify_release.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives
        run: python scripts/verify_release.py dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
